<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond</title>
<style>
  body { font-family: Arial, sans-serif; background: #0d1b2a; color: #f0f0f0;
         padding: 20px; text-align: center; }
  h1 { color: #7fdbff; font-size: 40px; margin: 10px 0; }
  #status { font-size: 22px; min-height: 60px; margin: 10px 0; }
  button { font-size: 20px; padding: 14px 24px; margin: 6px; border: none;
           border-radius: 10px; background: #7fdbff; color: #0d1b2a; }
  #stop { background: #ff6b6b; color: #fff; }
  #action { background: #ffd166; display: none; }
  #log { text-align: left; font-size: 14px; color: #9fb3c8; background: #13293d;
         padding: 10px; border-radius: 8px; height: 220px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Diamond</h1>
<div id="status">Tap Start Diamond once.</div>
<button id="start">Start Diamond</button>
<button id="stop">Stop</button>
<button id="action"></button>
<h3>Debug log</h3>
<div id="log"></div>

<script>
  // Put real numbers here, with country code (example: +15551234567)
  const CONTACTS = { mom: "+10000000000", dad: "+10000000001" };

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const statusEl = document.getElementById("status");
  const logEl = document.getElementById("log");
  const actionBtn = document.getElementById("action");

  let rec = null, wantListening = false, speaking = false, awakeUntil = 0, flashTrack = null, flashOn = false;

  function log(t) { logEl.textContent += new Date().toLocaleTimeString() + "  " + t + "\n"; logEl.scrollTop = logEl.scrollHeight; }
  function setStatus(t) { statusEl.textContent = t; log("STATUS: " + t); }

  function startRec() {
    if (!rec || !wantListening || speaking) return;
    try { rec.start(); log("listening..."); } catch (e) { log("start skipped: " + e.message); }
  }

  function speak(text, after) {
    setStatus(text);
    speaking = true;
    try { rec && rec.abort(); } catch (e) {}
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      speaking = false;
      log("finished speaking");
      setTimeout(() => { if (after) after(); startRec(); }, 800);
    };
    u.onend = finish;
    u.onerror = (e) => { log("voice error: " + e.error); finish(); };
    speechSynthesis.speak(u);
    setTimeout(finish, Math.min(20000, 2000 + text.length * 90));
  }

  function wake() { awakeUntil = Date.now() + 60000; }
  function isAwake() { return Date.now() < awakeUntil; }

  function setupRec() {
    rec = new SR();
    rec.lang = "en-US";
    rec.continuous = false;
    rec.interimResults = false;
    rec.onresult = (e) => {
      const said = e.results[0][0].transcript;
      log("HEARD: \"" + said + "\"");
      handle(said);
    };
    rec.onerror = (e) => {
      log("recognition error: " + e.error);
      if (e.error === "not-allowed") { wantListening = false; setStatus("Microphone blocked. Allow it in Chrome site settings."); }
    };
    rec.onend = () => { log("recognition ended"); setTimeout(startRec, 300); };
  }

  function normalize(t) {
    return t.toLowerCase().trim()
      .replace(/you ?tube/g, "youtube")
      .replace(/\b(dimond|dymond|daimond|diamon|diamund)\b/g, "diamond")
      .replace(/\s+/g, " ");
  }

  function handle(raw) {
    const text = normalize(raw);
    if (/hello sir|i am diamond|what do you want me to do/.test(text)) { log("ignored (Diamond's own voice)"); return; }

    const hasName = /\bdiamond\b/.test(text);
    if (!isAwake() && !hasName) { log("ignored (say Diamond first)"); return; }

    let cmd = hasName ? text.replace(/^.*?\bdiamond\b[,\s]*/, "").trim() : text;
    wake();

    if (!cmd) { speak("Yes sir?"); return; }
    route(cmd);
  }

  function route(cmd) {
    log("COMMAND: " + cmd);

    if (/shut up|enough|be quiet|stop talking/.test(cmd)) {
      speechSynthesis.cancel(); speaking = false; setStatus("Diamond is quiet.");
      setTimeout(startRec, 500); return;
    }

    if (/flash ?light|torch/.test(cmd)) {
      const off = /\boff\b/.test(cmd);
      toggleFlash(!off);
      return;
    }

    const call = cmd.match(/^call (.+)$/);
    if (call) {
      const who = call[1].trim();
      const num = CONTACTS[who];
      if (!num) { speak("I don't have " + who + " saved yet."); return; }
      speak("Calling " + who + ".", () => { location.href = "tel:" + num; });
      return;
    }

    if (cmd.includes("youtube")) {
      showAction("Open YouTube", "https://www.youtube.com");
      speak("Tap the yellow button to open YouTube.");
      return;
    }

    const play = cmd.match(/^play (.+)$/);
    if (play) {
      showAction("Play " + play[1], "https://www.youtube.com/results?search_query=" + encodeURIComponent(play[1]));
      speak("Tap the yellow button to play " + play[1] + ".");
      return;
    }

    const search = cmd.match(/^search (?:for )?(.+)$/);
    if (search) {
      showAction("Search: " + search[1], "https://www.google.com/search?q=" + encodeURIComponent(search[1]));
      speak("Tap the yellow button to see results.");
      return;
    }

    askDiamond(cmd);
  }

  function showAction(label, url) {
    actionBtn.textContent = label;
    actionBtn.style.display = "inline-block";
    actionBtn.onclick = () => window.open(url, "_blank");
  }

  async function askDiamond(question) {
    setStatus("Thinking...");
    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: question })
      });
      const data = await r.json();
      log("AI response status: " + r.status);
      speak(data.reply || data.error || "I could not get an answer.");
    } catch (e) {
      log("AI error: " + e.message);
      speak("I could not reach the AI service.");
    }
  }

  async function toggleFlash(on) {
    try {
      if (!flashTrack) {
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        flashTrack = s.getVideoTracks()[0];
      }
      await flashTrack.applyConstraints({ advanced: [{ torch: on }] });
      speak(on ? "Flashlight on." : "Flashlight off.");
    } catch (e) {
      log("flash error: " + e.message);
      speak("This browser can't control the flashlight.");
    }
  }

  document.getElementById("start").onclick = async () => {
    log("Start tapped");
    if (!SR) { setStatus("Voice not supported. Open this page in Chrome."); return; }
    if (!rec) setupRec();
    wantListening = true;
    wake();
    speak("Hello sir, I am Diamond. What do you want me to do for you today?");
  };

  document.getElementById("stop").onclick = () => {
    speechSynthesis.cancel(); speaking = false; setStatus("Diamond is quiet.");
    setTimeout(startRec, 500);
  };
</script>
</body>
</html>
