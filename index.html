<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond</title>
<style>
  body { font-family: Arial, sans-serif; background: #0d1b2a; color: #f0f0f0;
         display: flex; flex-direction: column; align-items: center;
         justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
  h1 { color: #7fdbff; font-size: 48px; margin: 0; }
  #status { font-size: 20px; min-height: 70px; max-width: 500px; margin: 20px 0; }
  #heard { font-size: 14px; color: #8899aa; min-height: 20px; }
  .orb { width: 120px; height: 120px; border-radius: 50%; background: #7fdbff;
         margin: 20px auto; box-shadow: 0 0 30px #7fdbff; transition: background .3s; }
  .orb.listening { animation: pulse 1.2s infinite; }
  .orb.speaking { background: #ffd166; box-shadow: 0 0 40px #ffd166; }
  @keyframes pulse { 50% { transform: scale(1.15); } }
  button { font-size: 20px; padding: 16px 28px; margin: 8px; border: none;
           border-radius: 10px; background: #7fdbff; color: #0d1b2a; cursor: pointer; }
  #stop { background: #ff6b6b; color: #fff; }
</style>
</head>
<body>
<h1>Diamond</h1>
<div id="orb" class="orb"></div>
<div id="status">Tap Start once to wake Diamond.</div>
<div id="heard"></div>
<button id="start">Start Diamond</button>
<button id="stop">Stop</button>

<script>
  // Replace these with real numbers, including country code (example: +15551234567)
  const CONTACTS = { mom: "+10000000000", dad: "+10000000001" };
  const WAKE_WORDS = ["hey diamond", "hello diamond", "hi diamond", "okay diamond"];
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  const statusEl = document.getElementById("status");
  const heardEl = document.getElementById("heard");
  const orb = document.getElementById("orb");

  let listening = false, awake = false, speaking = false;
  let recognition = null, flashTrack = null, flashOn = false;
  let speakId = 0, sleepTimer = null;

  function setStatus(t) { statusEl.textContent = t; }

  function wakeUp() {
    awake = true;
    clearTimeout(sleepTimer);
    sleepTimer = setTimeout(() => {
      awake = false;
      setStatus("Say Hey Diamond or clap twice to wake me.");
    }, 30000);
  }

  function restartListening() {
    if (listening && !speaking && recognition) {
      try { recognition.start(); } catch (e) {}
    }
  }

  function speak(text) {
    setStatus(text);
    const id = ++speakId;
    speechSynthesis.cancel();
    speaking = true;
    orb.className = "orb speaking";
    if (recognition) { try { recognition.abort(); } catch (e) {} }

    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    const done = () => {
      if (id !== speakId) return;
      speaking = false;
      orb.className = "orb listening";
      restartListening();
    };
    u.onend = done;
    u.onerror = done;
    speechSynthesis.speak(u);
  }

  function stopAll() {
    speakId++;
    speechSynthesis.cancel();
    speaking = false;
    awake = false;
    orb.className = "orb listening";
    setStatus("Diamond is quiet. Say Hey Diamond to wake me.");
    restartListening();
  }

  function greet() {
    wakeUp();
    speak("Hello sir, I am Diamond. What do you want me to do for you today?");
  }

  function makeRecognizer() {
    const r = new SR();
    r.lang = "en-US";
    r.continuous = true;
    r.interimResults = false;
    r.onresult = (e) => {
      const last = e.results[e.results.length - 1][0].transcript.toLowerCase().trim();
      heardEl.textContent = "Heard: " + last;
      handleSpeech(last);
    };
    r.onend = () => restartListening();
    r.onerror = (e) => {
      if (e.error === "not-allowed") {
        setStatus("Microphone is blocked. Allow it in Chrome's site settings.");
        listening = false;
      }
    };
    return r;
  }

  function handleSpeech(text) {
    const wake = WAKE_WORDS.find(w => text.includes(w));
    if (!awake && !wake) return;

    if (wake) {
      wakeUp();
      const rest = text.split(wake)[1].trim();
      if (!rest) { greet(); return; }
      text = rest;
    }
    wakeUp();

    if (/shut up|enough|be quiet|stop talking/.test(text)) {
      stopAll();
      return;
    }
    if (/flash ?light|torch/.test(text)) {
      const turnOn = /turn on|on/.test(text) && !/off/.test(text);
      const turnOff = /off/.test(text);
      toggleFlash(turnOff ? false : turnOn ? true : !flashOn);
      return;
    }
    const callMatch = text.match(/^call (.+)/);
    if (callMatch) {
      const who = callMatch[1].trim();
      const num = CONTACTS[who];
      if (num) {
        speak("Calling " + who + ".");
        location.href = "tel:" + num;
      } else {
        speak("I don't have " + who + " saved yet. Add the number in the code.");
      }
      return;
    }
    if (text.includes("open youtube")) {
      window.open("https://www.youtube.com", "_blank");
      speak("Opening YouTube.");
      return;
    }
    if (text.startsWith("play ")) {
      const q = text.replace(/^play\s+/, "");
      window.open("https://www.youtube.com/results?search_query=" + encodeURIComponent(q), "_blank");
      speak("Playing " + q + " on YouTube.");
      return;
    }
    if (text.startsWith("search")) {
      const q = text.replace(/^search( the web)?( for)?\s*/, "");
      window.open("https://www.google.com/search?q=" + encodeURIComponent(q), "_blank");
      speak("Searching for " + q + ".");
      return;
    }
    askDiamond(text);
  }

  async function askDiamond(question) {
    setStatus("Thinking...");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: question })
      });
      const data = await res.json();
      speak(data.reply || data.error || "Something went wrong.");
    } catch (e) {
      speak("I'm offline right now. I can still call, open YouTube, search, or use the flashlight.");
    }
  }

  async function toggleFlash(on) {
    try {
      if (!flashTrack) {
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        flashTrack = s.getVideoTracks()[0];
      }
      await flashTrack.applyConstraints({ advanced: [{ torch: on }] });
      flashOn = on;
      speak(on ? "Flashlight on." : "Flashlight off.");
    } catch (e) {
      speak("This browser can't control the flashlight on your phone. The Android app can do this later.");
    }
  }

  function startClapDetector(stream) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    src.connect(analyser);
    const buf = new Float32Array(analyser.fftSize);
    let lastClap = 0, lastPeak = 0;

    setInterval(() => {
      analyser.getFloatTimeDomainData(buf);
      let peak = 0;
      for (const v of buf) peak = Math.max(peak, Math.abs(v));
      const now = Date.now();
      // Threshold 0.3: if claps are missed, lower it. If random noise triggers it, raise it.
      if (peak > 0.3 && now - lastPeak > 200) {
        lastPeak = now;
        if (lastClap && now - lastClap < 1000) {
          lastClap = 0;
          speechSynthesis.cancel();
          speaking = false;
          greet();
        } else {
          lastClap = now;
        }
      }
    }, 50);
  }

  document.getElementById("start").addEventListener("click", async () => {
    if (!SR) {
      setStatus("Voice is not supported in this browser. Please open this page in Chrome.");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      startClapDetector(stream);
    } catch (e) {
      setStatus("Please allow the microphone, then tap Start again.");
      return;
    }
    listening = true;
    recognition = makeRecognizer();
    try { recognition.start(); } catch (e) {}
    greet();
  });

  document.getElementById("stop").addEventListener("click", stopAll);
</script>
</body>
</html>
